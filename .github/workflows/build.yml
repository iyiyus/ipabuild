name: Build credential bundle

# 手动触发：仓库页面 → Actions → Build credential bundle → Run workflow
# 构建产物在 run 页面下方 Artifacts 下载（credential-bundle.zip）
on:
  workflow_dispatch:

jobs:
  build:
    # macOS 构建机自带完整 Xcode（iphoneos SDK）
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build device binaries
        run: make

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: credential-bundle
          path: build/bundle/
          if-no-files-found: error
